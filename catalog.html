<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Hit Cafe — Каталог</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к основному содержимому</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">Star Hit Cafe</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <button class="menu-toggle" id="menuToggle" aria-label="Открыть меню" aria-expanded="false">☰ Меню</button>
        <ul class="nav-list" id="navList">
          <li><a href="index.html" class="nav-link">Главная</a></li>
          <li><a href="catalog.html" class="nav-link active">Каталог</a></li>
          <li><a href="product.html" class="nav-link">Товар</a></li>
          <li><a href="order.html" class="nav-link">Заказ</a></li>
          <li><a href="contacts.html" class="nav-link">Контакты</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="header-action" id="themeToggle" type="button" aria-pressed="false">Тёмная тема</button>
        <a class="header-action favorites-counter" href="catalog.html">Избранное: 0</a>
        <a class="header-action cart-counter" href="order.html">Корзина: 0</a>
      </div>
    </div>
  </header>

  <main id="main" class="main-content">
    <h1 class="page-title">Каталог товаров</h1>

    <section class="catalog-controls" aria-label="Управление каталогом">
      <div class="catalog-controls__group">
        <label for="catalog-search">Поиск товара</label>
        <input
          id="catalog-search"
          class="catalog-controls__input"
          type="search"
          placeholder="Введите название товара"
          autocomplete="off"
        >
      </div>

      <div class="catalog-controls__group">
        <label for="category-filter">Категория</label>
        <select id="category-filter" class="catalog-controls__select">
          <option value="all">Все категории</option>
          <option value="hot">Горячие напитки</option>
          <option value="cold">Холодные напитки</option>
          <option value="dessert">Десерты</option>
        </select>
      </div>

      <div class="catalog-controls__group">
        <label for="sort-select">Сортировка</label>
        <select id="sort-select" class="catalog-controls__select">
          <option value="default">По умолчанию</option>
          <option value="price-asc">Сначала дешевле</option>
          <option value="price-desc">Сначала дороже</option>
          <option value="title-asc">По названию А-Я</option>
          <option value="rating-desc">По рейтингу</option>
        </select>
      </div>
    </section>

    <p class="catalog-count" aria-live="polite"></p>
    <p class="catalog-empty" hidden>По выбранным условиям товары не найдены.</p>

    <div class="products-grid" data-products-container></div>

    <nav class="pagination" aria-label="Страницы каталога"></nav>
  </main>

  <dialog id="product-modal" class="modal" aria-labelledby="modal-title">
    <button class="modal__close" id="modal-close" type="button" aria-label="Закрыть окно товара">×</button>
    <div class="modal__content">
      <img class="modal__image" id="modal-image" src="" alt="">
      <div class="modal__info">
        <h2 class="modal__title" id="modal-title"></h2>
        <p class="modal__rating" id="modal-rating"></p>
        <p class="modal__description" id="modal-description"></p>
        <p class="modal__price" id="modal-price"></p>
        <p class="modal__status" id="modal-status"></p>
        <table class="styled-table modal__table">
          <caption>Характеристики</caption>
          <tbody id="modal-specs"></tbody>
        </table>
        <button class="btn btn--accent" id="modal-add" type="button">В корзину</button>
      </div>
    </div>
  </dialog>

  <footer class="site-footer">
    <p>&copy; 2026 Учебный проект. Все права защищены.</p>
  </footer>

  <script src="js/data.js" defer></script>
  <script src="js/catalog.js" defer></script>
  <script src="js/modal.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
