<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Hit Cafe — Заказ</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к основному содержимому</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">Star Hit Cafe</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">Главная</a></li>
          <li><a href="catalog.html" class="nav-link">Каталог</a></li>
          <li><a href="product.html" class="nav-link">Товар</a></li>
          <li><a href="order.html" class="nav-link active" aria-current="page">Заказ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="main-content">
    <h1 class="page-title">Оформление заказа</h1>
    <form class="order-form">
      <div class="form-group">
        <label for="name">Имя *</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group full-width">
        <label for="comment">Комментарий</label>
        <textarea id="comment" name="comment" rows="4"></textarea>
      </div>
      <div class="form-group full-width">
        <label><input type="checkbox" required> Согласен на обработку данных *</label>
      </div>
      <button type="submit" class="btn">Отправить</button>
    </form>
  </main>
  <footer class="site-footer">
    <p>&copy; 2026 Учебный проект.</p>
  </footer>
</body>
</html>
